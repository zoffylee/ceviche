[build-system]
build-backend = "uv_build"
requires = [ "uv-build~=0.13.8" ]

[project]
name = "ceviche"
version = "0.1.3"
description = "Ceviche"
readme = "README.md"
license-files = [ "LICENSE" ]
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.0.3",
    "numpy>=1.16.2",
    "py-mkl-pardiso>=0.0.6",
    "scipy>=1.2.1",
    "torch==2.14.1+cu126",
]
[[project.authors]]
name = "Ceviche Package Contributors"
email = "fancompute+noreply@gmail.com"
[project.urls]
Homepage = "https://github.com/fancompute/ceviche"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.105",
]

[tool.uv]
index = [
    { name = "cernet", url = "https://avoidzju.mirrors.cernet.edu.cn/pypi/web/simple/", default = true },
    { name = "pytorch-cu126", url = "https://download.pytorch.org/whl/cu126", explicit = true },
]
cache-dir = "../.cache/uv"
python-install-mirror = "https://avoidzju.mirrors.cernet.edu.cn/github-release/astral-sh/python-build-standalone"
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
[tool.uv.build-backend]
module-name = "ceviche"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [ "**/.*", "**/__pycache__", "data", "runs" ]
[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
[tool.ruff.lint]
extend-select = [ "I" ]

[tool.pyproject-fmt]
column_width = 120
indent = 4
generate_python_version_classifiers = false
table_format = "long"

[tool.ty.src]
include = [ "ceviche", "examples", "tests" ]
exclude = [ ".cache", ".venv", "build", "dist", "**/__pycache__" ]
[tool.ty.environment]
python = ".venv"
python-version = "3.12"
[tool.ty.terminal]
error-on-warning = true
